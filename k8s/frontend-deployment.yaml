apiVersion: apps/v1
kind: Deployment
metadata:
  name: edoble-web
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edoble-web
  template:
    metadata:
      labels:
        app: edoble-web
    spec:
      containers:
        - name: edoble-web
          image: REPLACE_WITH_IMAGE
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: edoble-web
  namespace: staging
spec:
  selector:
    app: edoble-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
